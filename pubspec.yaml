name: matjar_aljanoub
description: متجر الجنوب - تطبيق تجارة إلكترونية متعدد البائعين
publish_to: "none"
version: 1.0.0+5
environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  firebase_core: ^4.7.0
  firebase_auth: ^6.4.0
  cloud_firestore: ^6.1.0
  firebase_storage: ^13.0.0
  image_picker: ^1.2.1
  firebase_messaging: ^16.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_native_splash: ^2.4.8
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/matjar_background.jpg
    - assets/icon/app_icon.png

flutter_native_splash:
  color: "#000000"
  image: assets/icon/app_icon.png
  android_12:
    color: "#000000"
    image: assets/icon/app_icon.png
  fullscreen: true

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/icon/app_icon.png
  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: assets/icon/app_icon.png
